const DEF_STATUS=[{id:'todo',label:'لسه هسجلهم ان شاء الله'},{id:'reg',label:'مسجلهم'},{id:'done',label:'مخلصهم'}];
const ST_MIG={new:'todo',now:'reg',prog:'reg',done:'done'};
function statusList(){if(!Array.isArray(S.statuses)||!S.statuses.length)S.statuses=DEF_STATUS.map(x=>({...x}));return S.statuses}
function statusDefault(){const l=statusList();return (S.settings.statusDefault&&l.some(x=>x.id===S.settings.statusDefault))?S.settings.statusDefault:l[0].id}
const stLabelOf=v=>{const x=statusList().find(y=>y.id===v);return x?x.label:''};
const stLabel=v=>stLabelOf(v)||'—';
const subjStatus=(s,ctx)=>{const l=stListOf(ctx||'subjects'),v=s&&s.status;return l.some(x=>x.id===v)?v:(ctx&&ctx!=='subjects'?stDefaultOf(ctx):statusDefault())};
function stListOf(ctx){if(ctx==='subjects'||!secOf(ctx))return statusList();const sc=secOf(ctx);if(!Array.isArray(sc.st)||!sc.st.length)sc.st=DEF_STATUS.map(x=>({...x}));return sc.st}
const stDefaultOf=ctx=>{const l=stListOf(ctx),d=secOf(ctx)&&secOf(ctx).stDef;return l.some(x=>x.id===d)?d:l[0].id};
const stLabelIn=(v,ctx)=>{const x=stListOf(ctx).find(y=>y.id===v);return x?x.label:''};
function migrateStatuses(){const l=statusList();walk(S.subjects,n=>{if(!n.subj)return;if(n.status&&l.some(x=>x.id===n.status))return;const m=ST_MIG[n.status];n.status=(m&&l.some(x=>x.id===m))?m:statusDefault()});if(!l.some(x=>x.id===S.settings.statusDefault))S.settings.statusDefault=l[0].id;
 for(const sc of(S.secs||[])){const sl=stListOf(sc.id);walk(sc.tree,n=>{if(!n.subj)return;if(n.status&&sl.some(x=>x.id===n.status))return;const m=ST_MIG[n.status];n.status=(m&&sl.some(x=>x.id===m))?m:sl[0].id})}}
function secBar(ctx,path){if(path.length)return '';const f=UI.subjF||'all',root=ctxRoot(ctx),cnt=k=>k==='all'?root.length:root.filter(x=>subjStatus(x,ctx)===k).length,nm=ctx==='subjects'?'المواد':secTitle(ctx);
 const hint=ctx==='subjects'?'كل مادة ليها مجلداتها وروابطها. ضيف مادة من الزر هنا أو من زر + ، وجوّه المادة ضيف مجلدات وروابط عادي.':'كل عنصر هنا ليه مجلداته وروابطه، زي الخزنة. ضيف عنصر من الزر هنا أو من زر +.';
 return `<div class="sec"><b>${esc(nm)}</b><div class="hint">${hint}</div><div class="bar" style="margin-top:10px"><button class="btn pri" data-act="addsubject">${ctx==='subjects'?'مادة':'عنصر'} +</button><button class="btn" data-act="statuses">تعديل الحالات</button><span class="sub">${root.length}</span></div>

async function addSubject(ctx){ctx=ctx||navCtx();const isS=ctx==='subjects',root=ctxRoot(ctx);

async function subjectStatus(id,ctx){const n=find(id)?.n;if(!n)return;ctx=ctx||(locate(id)||{}).ctx||'subjects';const l=stListOf(ctx);const r=await dialog(`<h3>حالة "${esc(n.title)}"</h3><label>الحالة</label><select name="st">${l.map(x=>`<option value="${x.id}" ${subjStatus(n,ctx)===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select><div class="hint">تقدر تضيف أو تعدّل الحالات من زر "تعديل الحالات" فوق.</div><div class="acts"><button class="btn pri" data-ok="1">حفظ</button><button class="btn" data-x>إلغاء</button></div>`);if(!r)return;snap();n.status=r.st;persist();render()}
async function manageStatuses(ctx){ctx=ctx||navCtx();const isS=ctx==='subjects',list=stListOf(ctx);const del=new Set();const rowHtml=x=>`<div class="bar" data-row="${x.id}"><input name="n_${x.id}" value="${esc(x.label)}" style="flex:1"><button type="button" class="btn dn" data-del="${x.id}">حذف</button></div>`;

 ()=>{document.querySelectorAll('#strows [data-del]').forEach(b=>b.onclick=()=>{if(document.querySelectorAll('#strows [data-row]').length<=1)return toast('لازم تفضل حالة واحدة على الأقل');del.add(b.dataset.del);b.closest('[data-row]').remove()})});
 if(!r)return;snap();const out=[];list.forEach(x=>{if(del.has(x.id))return;const v=String(r['n_'+x.id]||'').trim();out.push({id:x.id,label:clip(v||x.label,40)})});
 const nv=String(r.newst||'').trim();if(nv)out.push({id:'s'+uid().slice(-6),label:clip(nv,40)});
 if(!out.length){toast('لازم تفضل حالة واحدة على الأقل');return}
 if(isS){S.statuses=out;if(!out.some(x=>x.id===S.settings.statusDefault))S.settings.statusDefault=out[0].id}
 else{const sc=secOf(ctx);sc.st=out;if(!out.some(x=>x.id===sc.stDef))sc.stDef=out[0].id}
 if(del.size)walk(ctxRoot(ctx),n=>{if(n.subj&&del.has(n.status))n.status=out[0].id});
 if(UI.subjF&&UI.subjF!=='all'&&!out.some(x=>x.id===UI.subjF))UI.subjF='all';
 persist();render();toast('اتحفظت الحالات')}
async function quickNote(id){const n=find(id)?.n;if(!n)return;const r=await dialog(`<h3>ملاحظة على "${esc(n.title)}"</h3><label>الملاحظة (اختياري، 200 حرف)</label><textarea name="note" rows="3" maxlength="200">${esc(n.note||'')}</textarea><div class="acts"><button class="btn pri" data-ok="1">حفظ</button><button class="btn" data-x>إلغاء</button></div>`);if(!r)return;snap();const v=clip(String(r.note||'').trim(),200);if(v)n.note=v;else delete n.note;persist();render()}

function searchScopeBar(){return `<div class="bar"><button class="btn ${UI.qAll?'':'on'}" data-act="qscope" data-v="0">القسم الحالي</button><button class="btn ${UI.qAll?'on':''}" data-act="qscope" data-v="1">كل الأقسام</button>${S.subjects.length?`<span class="sp"></span><label class="btn">المادة <select data-act="qsub" style="background:none;border:0"><option value="">كل المواد</option>${S.subjects.map(x=>`<option value="${x.id}" ${UI.qSub===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label>`:''}</div>`}
function searchGroups(ctx,q){const inSub=x=>{if(!UI.qSub)return true;const l=locate(x.n.id);return !!l&&l.ctx==='subjects'&&(l.path[0]===UI.qSub||x.n.id===UI.qSub)};
 const pick=arr=>searchAll(arr,q).filter(inSub);
 if(!UI.qAll)return[{label:ctx==='imports'?'المستوردات':ctx==='subjects'?'المواد':'الخزنة',items:pick(ctxRoot(ctx))}];
 return[{label:'الخزنة',items:pick(S.vault)},{label:'المواد',items:pick(S.subjects)},{label:'المستوردات',items:pick(S.imports)}].filter(g=>g.items.length)}
// ---------- import compare / merge ----------
function urlKey(u){return String(u||'').toLowerCase().replace(/^https?:\/\/(www\.)?/,'').replace(/\/+$/,'')}
function compareImport(oldKids,fresh){const o=new Set(),n=new Set();walk(oldKids,x=>{if(x.kind==='link')o.add(urlKey(x.url))});walk(fresh,x=>{if(x.kind==='link')n.add(urlKey(x.url))});
 let same=0,added=0,removed=0;for(const k of n){if(o.has(k))same++;else added++}for(const k of o)if(!n.has(k))removed++;return{same,added,removed}}
function mergeImport(old,fresh){const byUrl=new Map(),byPath=new Map();
 walk(old.children,x=>{if(x.kind==='link')byUrl.set(urlKey(x.url),x)});
 (function rec(a,p){a.forEach(x=>{if(x.kind==='folder'){byPath.set(p+'/'+x.title,x);rec(x.children,p+'/'+x.title)}})})(old.children,'');
 (function rec(a,p){a.forEach(x=>{if(x.kind==='link'){const o=byUrl.get(urlKey(x.url));if(o){['img','imgCustom','icon','tags','pinned','note','opens','last','hist','added'].forEach(k=>{if(o[k]!==undefined)x[k]=o[k]})}}
  else{const o=byPath.get(p+'/'+x.title);if(o){if(o.color)x.color=o.color;if(o.shape!=null)x.shape=o.shape;if(o.icon)x.icon=o.icon;if(o.tags&&o.tags.length)x.tags=o.tags;if(o.note)x.note=o.note;if(o.open)x.open=o.open}rec(x.children,p+'/'+x.title)}})})(fresh,'');
 prep(fresh);old.children=fresh;old.updated=now()}

 rec(S.vault,0,'الخزنة');rec(S.subjects,0,'المواد');rec(S.imports,0,'المستوردات');
 const box=rows.map(([id,d,kind,title])=>`<label style="color:var(--tx);display:block;padding-inline-start:${d*16}px"><input type="checkbox" name="p_${id}" value="1" style="width:auto"> ${kind==='folder'?'📁':'🔗'} ${esc(title)}</label>`).join('');

 if(!ids.length){toast('مفيش عناصر محددة');return null}
 return pruneIds(ids)}

const pinBadge=n=>n.pinned?`<span class="pinb" title="مثبّت">${PIN}</span>`:'';
function fIcon(n,sz){if(n.icon&&safeImg(n.icon))return`<span class="fsvg fimg" data-bgi="${n.id}" style="width:${sz||64}px;height:${Math.round((sz||64)*.9)}px"></span>`;return n.browser?brIcon(n.browser,sz||62):folderSvg(n.color,n.shape)}
const normTags=s=>{const seen=new Set(),o=[];for(let t of String(s||'').split(/[,،\n]/)){t=t.trim().replace(/^#+/,'').trim().slice(0,40);const k=t.toLowerCase();if(t&&!seen.has(k)){seen.add(k);o.push(t)}}return o.slice(0,20)};
function tagIndex(){const m=new Map();for(const root of[S.vault,S.imports,S.subjects])walk(root,n=>{(n.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1))});return m}
function tagWidget(init){return`<label>تاجات (اكتب واضغط Enter أو فاصلة)</label><div class="tagbox" id="tgb"><span id="tgchips"></span><input id="tgin" data-noenter="1" autocomplete="off" placeholder="تاج جديد…"><div id="tgsug" hidden></div></div><input type="hidden" name="tags" value="${esc(init.join(','))}">`}
function mountTags(){const box=$('#tgb');if(!box)return;const hid=$('#dlg input[name=tags]'),inp=$('#tgin'),chips=$('#tgchips'),sug=$('#tgsug');let list=normTags(hid.value);const idx=tagIndex();
 const sync=()=>{hid.value=[...list,inp.value.trim()].filter(Boolean).join(',')};
 const draw=()=>{chips.innerHTML=list.map((t,i)=>`<span class="tag chip">#${esc(t)}<b data-rm="${i}" role="button" aria-label="حذف التاج">×</b></span>`).join('');
  const q=inp.value.trim().replace(/^#/,'').toLowerCase();const c=[...idx].filter(([t])=>!list.some(x=>x.toLowerCase()===t.toLowerCase())&&(!q||t.toLowerCase().includes(q))).sort((a,b)=>b[1]-a[1]).slice(0,8);
  sug.innerHTML=c.map(([t,n])=>`<div data-t="${esc(t)}"><span>#${esc(t)}</span><small>${n}</small></div>`).join('');sug.hidden=!c.length||document.activeElement!==inp};
 const add=t=>{list=normTags([...list,t].join(','));inp.value='';sync();draw()};
 chips.onclick=e=>{const i=e.target.dataset?.rm;if(i!==undefined){list.splice(+i,1);sync();draw();inp.focus()}};
 sug.onmousedown=e=>{e.preventDefault();const t=e.target.closest('[data-t]')?.dataset.t;if(t)add(t)};
 inp.oninput=()=>{if(/[,،]/.test(inp.value)){const parts=inp.value.split(/[,،]/);parts.slice(0,-1).forEach(add);inp.value=parts.at(-1)}sync();draw()};
 inp.onfocus=draw;inp.onblur=()=>setTimeout(()=>{sug.hidden=true},120);
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(inp.value.trim())add(inp.value);else $('#dlg [data-ok="1"]')?.click()}else if(e.key==='Backspace'&&!inp.value&&list.length){list.pop();sync();draw()}};
 draw()}
async function resizeImg(file,max=384){if(file.size>30e6)throw new Error('big');const url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();const w0=im.naturalWidth||max,h0=im.naturalHeight||max,k=Math.min(1,max/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const u=c.toDataURL('image/webp',.85);return u.startsWith('data:image/webp')?u:c.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
function imgCtl(cur){return`<label>صورة مخصصة (اختياري)</label><div class="imgc"><div class="imgp" id="imgp" style="${cur&&safeImg(cur)?`background-image:url('${cur}')`:''}"></div><button type="button" class="btn" id="imgpick">اختر صورة من الجهاز</button><button type="button" class="btn" id="imglib">من المكتبة</button><button type="button" class="btn dn" id="imgdel" ${cur?'':'hidden'}>حذف الصورة</button><input type="hidden" name="imgdata" value=""><input type="hidden" name="imgclr" value=""></div><div class="libp" id="libp" hidden></div>`}

const ART=Array.from({length:41},(_,i)=>'a'+String(i+1).padStart(2,'0'));
async function libGrid(onPick){const g=$('#libp');g.hidden=false;g.innerHTML='<div class="sub">بحمّل…</div>';
 const mine=await Promise.all([...S.images].sort((a,b)=>b.added-a.added).map(async it=>({k:'u'+it.id,id:it.id,u:await imgUrl(it,false)})));
 const built=await Promise.all(ART.map(async k=>({k,u:await B.art(k+'.t.webp')})));
 const tile=(x,t)=>x.u?`<button type="button" class="lt" data-lk="${x.k}" title="${t}" style="background-image:url('${x.u}')"></button>`:'';
 g.innerHTML=`<div class="lh"><b>مكتبتي (${mine.length})</b><button type="button" class="btn" id="libadd">إضافة صور للمكتبة</button></div>${mine.length?`<div class="lg">${mine.map(x=>tile(x,'صورتي')).join('')}</div>`:'<div class="sub">لسه مفيش صور من عندك. اضغط إضافة.</div>'}<div class="lh"><b>جاهزة (${built.length})</b></div><div class="lg">${built.map(x=>tile(x,'')).join('')}</div>`;
 $('#libadd').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{if(i.files.length){await addImages([...i.files]);libGrid(onPick)}};i.click()};
 g.onclick=async e=>{const b=e.target.closest('[data-lk]');if(!b)return;const k=b.dataset.lk;try{let u;if(k[0]==='u'){const it=S.images.find(x=>x.id===k.slice(1));const u8=await BIN.read('images',it.file);u=await resizeImg(new Blob([u8],{type:it.mime}))}else u=await B.art(k+'.webp');if(u&&safeImg(u)){g.hidden=true;onPick(u)}else toast('مقدرتش أحمّل الصورة دي')}catch{toast('مقدرتش أحمّل الصورة دي')}}}
function mountImg(){const pk=$('#imgpick');if(!pk)return;const d=$('#imgdel'),p=$('#imgp'),hd=$('#dlg input[name=imgdata]'),hc=$('#dlg input[name=imgclr]');
 pk.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const u=await resizeImg(f);hd.value=u;hc.value='';p.style.backgroundImage=`url('${u}')`;d.hidden=false}catch(e){toast(e.message==='big'?'الصورة كبيرة قوي (أكتر من 30 ميجا)':'الملف ده مش صورة بتتفتح')}};i.click()};
 d.onclick=()=>{hd.value='';hc.value='1';p.style.backgroundImage='';d.hidden=true};
 const lb=$('#imglib');if(lb)lb.onclick=()=>{const g=$('#libp');if(!g.hidden){g.hidden=true;return}libGrid(u=>{hd.value=u;hc.value='';p.style.backgroundImage=`url('${u}')`;d.hidden=false})}}

 $('#dlg').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&!e.target.dataset.noenter){const ok=$('#dlg [data-ok="1"]');if(ok&&ok.disabled)return;e.preventDefault();done(collect())}if(e.key==='Escape')done(null)}})}

function dropZone(e,c){const r=c.getBoundingClientRect(),horiz=c.classList.contains('xt-explorer')||c.classList.contains('xt-hex')||c.closest('.lgrid,.fgrid,.grid');const p=horiz?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height;const rtl=getComputedStyle(c).direction==='rtl';const q=horiz&&rtl?1-p:p;const fol=!!c.dataset.folder;
 if(fol&&q>.25&&q<.75)return'in';if(!fol&&UI.drag&&UI.drag.kind==='link'&&UI.drag.ctx===c.dataset.ctx&&q>.28&&q<.72)return'merge';return q<.5?'before':'after'}
function mergeLinks(dragId,tid){const f=find(dragId),t=find(tid);if(!f||!t||f.n.kind!=='link'||t.n.kind!=='link'||dragId===tid)return;snap();
 const fol={kind:'folder',id:uid(),title:'مجلد جديد',children:[t.n],color:COLORS[0],shape:0,tags:[],hist:[],opens:0,added:now(),pinned:false,open:true};
 t.arr[t.arr.indexOf(t.n)]=fol;f.arr.splice(f.arr.indexOf(f.n),1);fol.children.push(f.n);S.settings.sort='manual';persist();render();startRename(fol.id);

function startRename(id){const c=document.querySelector(`.card[data-id="${id}"]`);const nm=c&&c.querySelector('.nm');if(!nm)return;const n=find(id)?.n;if(!n)return;const old=n.title;c.draggable=false;nm.contentEditable='plaintext-only';nm.classList.add('rn');nm.removeAttribute('data-act');nm.focus();const rg=document.createRange();rg.selectNodeContents(nm);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);
 let fin=false;const end=ok=>{if(fin)return;fin=true;const v=nm.textContent.trim().slice(0,300);if(ok&&v&&v!==old){n.title=v;persist()}render()};nm.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();end(true)}if(e.key==='Escape'){e.preventDefault();end(false)}};nm.onblur=()=>end(true)}
async function moveNodes(ids,dest,rootCtx){if(dest===undefined)return;const d=dest?find(dest)?.n:null;const tgt=d?d.children:ctxRoot(rootCtx||'vault');
 snap();let c=0;for(const id of ids){const f=find(id);if(!f)continue;if(d){let bad=false;if(f.n.kind==='folder')walk([f.n],x=>{if(x.id===d.id)bad=true});if(bad)continue}f.arr.splice(f.arr.indexOf(f.n),1);tgt.push(f.n);c++}UI.sel.clear();persist();render();if(c>1)toast(`اتنقل ${c} عنصر`)}

function insertInto(id,destId,destCtx,copy){const src=find(id);if(!src)return 0;const d=destId?find(destId)?.n:null;if(d&&d.id===id)return 0;if(d){let bad=false;if(src.n.kind==='folder')walk([src.n],x=>{if(x.id===d.id)bad=true});if(bad)return 0}

async function dropInto(id,destId,destCtx){const src=locate(id);if(!src)return;const to=destCtx||(destId?(locate(destId)||{}).ctx:'vault');const from=src.ctx;

 return`<div class="stbar"><div class="stt"><b>${tot}</b><span>رابط في البرنامج كله</span></div><div class="stt"><b>${tf}</b><span>مجلد</span></div><div class="stt"><b>${rows.length}</b><span>قسم</span></div></div>${rows.map(r=>`<div class="srow" data-act="gosec" data-id="${r.id}"><span class="snm">${r.icon?secIcon(r.icon,14):''}${esc(r.title)}<span class="sub" style="font-weight:400"> · ${r.folders} مجلد</span></span><b>${r.links}</b><span class="dbar"><i style="width:${r.links?Math.max(6,Math.round(r.links/mx*100)):0}%"></i></span></div>`).join('')}`}

 const never=links.filter(l=>!l.opens).length,dup=(()=>{const m=new Map();for(const l of links){const k=String(l.url||'').replace(/\/$/,'').replace(/^https?:\/\/(www\.)?/,'').toLowerCase();m.set(k,(m.get(k)||0)+1)}return [...m.values()].filter(v=>v>1).length})();

window.addEventListener('mouseup',e=>{if(e.button===3){e.preventDefault();navBack()}else if(e.button===4){e.preventDefault();navFwd()}});
document.addEventListener('paste',e=>{if(UI.tab!=='images'||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')||$('#veil').style.display==='flex')return;const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();addImages(fs)}});
let extHoverT=null;
function extUri(dt){try{const u=dt.getData('text/uri-list')||dt.getData('text/plain')||'';const line=u.split(/\r?\n/).map(x=>x.trim()).find(x=>x&&!x.startsWith('#'));return line||''}catch{return ''}}
async function extUrls(e){const dt=e.dataTransfer;if(!dt)return[];const out=[];for(const f of [...(dt.files||[])]){if(/\.url$/i.test(f.name||'')){try{const t=await f.text();const m=t.match(/^\s*URL\s*=\s*(.+)$/im);if(m)out.push(m[1].trim())}catch{}}}
 const one=extUri(dt);if(one)out.push(one);return out.filter(Boolean)}
document.addEventListener('dragover',e=>{if(UI.drag)return;const dt=e.dataTransfer;if(!dt)return;const ty=[...dt.types];if(UI.tab==='images')return;
 if(ty.includes('x/ctx'))return;
 if(!(ty.includes('Files')||ty.includes('text/uri-list')||ty.includes('text/plain')))return;
 e.preventDefault();dt.dropEffect='copy';
 const card=e.target.closest&&e.target.closest('.card.fol[data-id]');
 if(card&&card.dataset.ctx===navCtx()){clearTimeout(extHoverT);const id=card.dataset.id,c=card.dataset.ctx;extHoverT=setTimeout(()=>{UI.settings.lastDest={...(UI.settings.lastDest||{}),[c]:id};enter(id)},700)}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)clearTimeout(extHoverT)});
document.addEventListener('drop',async e=>{if(UI.drag)return;const dt=e.dataTransfer;if(!dt||UI.tab==='images')return;
 const files=[...(dt.files||[])];if([...dt.types].includes('x/ctx'))return;const uri=extUri(dt);if(!files.length&&!uri)return;clearTimeout(extHoverT);
 const onlyHtml=files.length&&files.every(f=>/\.html?$/i.test(f.name||''))&&!uri;
 if(onlyHtml){e.preventDefault();UI.tab='imports';render();toast('ملفات المفضلة بتتضاف من قسم الاستيراد: اضغط "اختيار ملف علامات"');return}
 e.preventDefault();const urls=await extUrls(e);if(!urls.length)return;
 const card=e.target.closest&&e.target.closest('.card.fol[data-id]');const ctx=navCtx();
 if(card&&card.dataset.ctx===ctx)UI.settings.lastDest={...(UI.settings.lastDest||{}),[ctx]:card.dataset.id};
 let added=0;for(const u of urls){const nu=normUrl(u);if(!nu)continue;await addLink(ctx,nu);added++}
 if(!added)toast('مفيش رابط في اللي رميته')});
document.addEventListener('mousemove',e=>{if(UI.drag&&e.buttons===0)UI.drag=null});
$('#sidev').onclick=()=>setSide(false);addEventListener('resize',()=>{if(S.settings.sideOpen)renderSide()});
{const stg=document.createElement('style');stg.textContent=Array.from({length:24},(_,i)=>`.card:nth-child(${i+1}){animation-delay:${i*16}ms}`).join('');document.head.appendChild(stg)}
async function checkLock(){if(!S.settings.pin)return;$('#lock').style.display='flex';$('#pin').value='';$('#pin').focus();$('#pin').oninput=async e=>{if(await hashPin(e.target.value)===S.settings.pin){$('#lock').style.display='none'}}}
window.rbQuickAdd=()=>{UI.tab='vault';render();addLink('vault')};
(async()=>{$('#logo').src=LOGO;$('#logo2').src=LOGO;await loadCore();try{const t=await B.load('vault.json');if(t){const o=JSON.parse(t);S={...S,...o,settings:{...S.settings,...o.settings}}}}catch{}S.subjects=Array.isArray(S.subjects)?S.subjects:[];S.secs=Array.isArray(S.secs)?S.secs:[];S.st=S.st||{};S.bk=S.bk||{};for(const x of S.secs){x.tree=Array.isArray(x.tree)?x.tree:[];prep(x.tree)}ensureKhazna();prep(S.vault);prep(S.imports);prep(S.subjects);migrateStatuses();S.images=S.images||[];S.settings.sideSec=S.settings.sideSec||{};if(innerWidth<=700)S.settings.sideOpen=false;applyTheme();render();bindSplash();try{if(S.settings.tray&&window.rbTray)window.rbTray(true);if(S.settings.hotkey&&window.rbHotkey&&!(await applyHotkey(true))){S.settings.hotkey=false;persist()}}catch{}await checkLock();try{if(!window.__appDir&&window.rbAppDir)window.__appDir=await window.rbAppDir()}catch{}try{for(const sc of allSecs()){const bk=bkOf(sc.id);if(bk.mode==='launch'||(bk.mode!=='manual'&&dueBk(bk)))await doSecBackup(sc.id,false)}const ab=bkOf(ALLBK);if(ab.mode==='launch'||(ab.mode!=='manual'&&dueBk(ab)))await doAllBackup(false,true)}catch(e){}})();
